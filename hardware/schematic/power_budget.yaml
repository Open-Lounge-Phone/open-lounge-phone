# Power budget checked by checks.check_power_budget on every build.
# Loads are mA at the 5 V USB input, from DESIGN.md §9.2. `vbus_direct` is the part that bypasses
# the charger (the LD2410C radar and, on USB power, the USB-C handset port - fed from VBUS through
# a diode and a 0.45 A switch); everything else flows through the BQ24074 and counts against its
# input current limit (ILIM). Handset (off-the-shelf UAC handset): ~30 mA idle, ~100 mA in a call
# (typical USB audio codec + receiver), 450 mA switch limit (a misbehaving device).

charger:
  # BQ24074 datasheet SLUS810N, Electrical Characteristics + Thermal Information
  k_ilim_aohm: {min: 1500, typ: 1610, max: 1720}   # ILIM = K_ILIM / R_ILIM, 0.5-1.5 A range
  r_ilim_tolerance: 0.01                            # 1 % resistor
  vsys_max_v: 4.5                                   # VO(REG) max; OUT is regulated, not VBUS
  theta_ja_c_per_w: 44.5
  tj_reg_c: 125                                     # charge current folds back above this

supply:
  vbus_max_v: 5.25          # USB 2.0 / Type-C default range 4.75-5.25 V
  ambient_max_c: 40         # inside the enclosure, warm room

# Supply-voltage ratings of everything on VSYS; must exceed charger vsys_max_v.
vsys_parts_max_v:
  NS4150B: 5.25
  LP5907-3.0: 5.5
  TLV62569: 5.5
  SN74LV1T125: 5.5
  SK6812MINI-E: 5.5
  SUPERCAP: 5.5

# margin: required headroom below the guaranteed-minimum ILIM for firmware-capped scenarios.
policy_margin: 0.10

scenarios:
  # name: [total_mA, vbus_direct_mA, source_limit_mA, kind]
  # kind: policy = firmware caps applied (must pass with margin);
  #       uncapped = firmware bug / caps off (must still not exceed guaranteed ILIM)
  # 13 x SK6812MINI-E since the 12-key deck (2026-09-27): LED rows scaled x13/11 from DESIGN.md §9.2
  idle_kids:               [94, 30, 1500, policy]
  idle_lounge:             [188, 109, 1500, policy]
  handset_call_lounge:     [345, 179, 1500, policy]
  speakerphone_lounge:     [405, 109, 1500, policy]
  ringing_max:             [782, 109, 1500, policy]
  worst_case_capped:       [1192, 200, 1500, policy]
  # uncapped: the charger path is unchanged by the handset (it is VBUS-direct); the source sees
  # up to 1873 mA, which is why Lounge ships with a 5 V / 3 A adapter.
  worst_case_uncapped:     [1873, 550, 1500, uncapped]
  # Default-USB source (USB-C "Default" Rp, or any USB-A charger via an A-to-C cable: 500 mA):
  # ringer <=0.5 W, LEDs <=8 % (13 LEDs; same 67 mA as 11 LEDs at 10 %), charging off.
  # ESP32 TX peak 266 + codecs 25 + e-ink 6 + misc 1 + LEDs 67 + amp 0.5 W/(4.4 V*0.9)=126.
  # On a Default source the handset port is powered only while off-hook (firmware), and the
  # speaker is off during a handset call, so ringing and handset calls are separate peaks.
  default_usb_kids:        [491, 0, 500, policy]
  default_usb_kids_handset_call: [365, 100, 500, policy]  # TX 266 + codecs 25 + e-ink 6 + misc 1 + LEDs 67 (-100 amp) + handset 100
  # Lounge requires a >=1.5 A USB-C source. On a Default source it runs in *reduced mode*:
  # radar powered off via LD_PWR_EN (presence falls back to hook/NFC), same caps as above, and
  # the phone reports power.reduced so the status strip and companion ask for a better charger.
  default_usb_lounge_reduced: [491, 0, 500, policy]
  # What Lounge would draw on a Default source if firmware did NOT enter reduced mode.
  default_usb_lounge_full: [591, 100, 500, advisory]

# Minimum advertised USB-C current per SKU for full-feature operation (see DESIGN.md §9).
required_source_ma:
  kids: 500
  lounge: 1500
