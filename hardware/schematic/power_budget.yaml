# Power budget of the minimal board, checked by checks.check_power_budget on every build.
# Currents in mA. One 3.3 V LDO from USB VBUS; the ringer runs from VBUS directly.

ldo:
  part: SGM2212-3.3
  vout_v: 3.3
  rated_ma: 800                 # SGM2212 rev A.2 p1 (current limit >= 810 mA, p6)
  dropout_max_mv: {100: 80, 500: 380, 800: 610}   # 3.3 V version, full temperature range, p6
  theta_ja_c_per_w: 117         # SOT-223-3, p3 (JEDEC board; our copper pour only helps)
  tj_max_c: 125                 # operating range p3; thermal shutdown at 165 C, p6

# The module must be fed by a supply able to deliver >= 0.5 A (WROOM-1 datasheet v1.8 p27)
module_supply_min_ma: 500

source:
  name: "USB default power (5.1k Rd, no PD)"
  limit_ma: 500                 # USB 2.0 default; Type-C "Default USB Power"
  vbus_min_v: 4.40              # worst case at the device receptacle (USB 2.0 low-power port)
  vbus_max_v: 5.25
  cable_ohm: 0.0                # already inside vbus_min_v

ambient_max_c: 40               # inside the enclosure, warm room
margin: 0.20                    # peak must stay 20 % below the LDO rating

loads_3v3:
  # peak: worst simultaneous; avg: a call in progress (Wi-Fi on, audio both ways, display on)
  esp32_s3_module: {peak_ma: 355, avg_ma: 150}   # TX 802.11b 20.5 dBm 355 mA peak (p28); avg EST: RX 95 mA (p28) + CPU
  es8311_and_earpiece: {peak_ma: 30, avg_ma: 8}  # 14 mW codec (ES8311 p1) + 1 Vrms full scale into 32+22 ohm (p9)
  display_module: {peak_ma: 60, avg_ma: 40}      # allowance: e-paper refresh ~8 mA; small OLED/TFT alternatives up to ~60 mA with backlight
  mic_bias: {peak_ma: 1, avg_ma: 1}              # electret 0.5 mA typ through 1k + 2.2k
  pullups_and_led: {peak_ma: 3, avg_ma: 2}       # I2C 2 x 0.7 mA, EN 0.33 mA, status LED 1.3 mA

loads_vbus:
  piezo_ringer: {peak_ma: 6, avg_ma: 0}          # 5 V across the 1k (TDK PS p2 circuit) while the NPN is on
  ldo_quiescent: {peak_ma: 2, avg_ma: 0}         # IGND 1.6 mA max at 800 mA, p6
