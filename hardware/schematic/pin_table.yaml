# ESP32-S3-WROOM-1U-N16R8 pin allocation of the minimal board (DESIGN.md §4).
# checks.py fails the build if the module's pad nets differ from this table, if a GPIO not
# listed here is connected, or if a rule below is broken.
#
# net:     net the GPIO connects to (null = must stay unconnected)
# rtc:     deep-sleep wake source: must be an RTC GPIO (0-21)
# pull:    up = needs exactly one pull-up resistor to 3V3 (I2C)
# strap:   strapping pin (datasheet v1.8 p13-15). `low_only: true` = only circuits that can
#          never pull the pin HIGH at reset (a key or hook switch to GND, a transistor base, an
#          LED): the required strap value is the default low (GPIO45 3.3 V flash, GPIO46 any).
#          GPIO0 keeps its internal weak pull-up (SPI boot); BOOT pulls it low.
# Fixed: PSRAM 35-37 unused (octal PSRAM), native USB 19/20. Free: IO43 (TXD0, ROM log).
gpio:
  0:  {net: BOOT, strap: true, note: "BOOT button to GND; internal weak pull-up = SPI boot (p13)"}
  1:  {net: STATUS_LED, note: "front side, far left: LED at the band's front-left"}
  2:  {net: HOOK, rtc: true, note: "MX switch under the hook plunger: low = handset on the hook; RTC = deep-sleep wake"}
  3:  {net: KEY_1, strap: true, low_only: true, note: "JTAG-source strap, ignored unless EFUSE_STRAP_JTAG_SEL is burned (p15)"}
  4:  {net: JACK_DET, note: "jack TN via 1k: low = no plug, high = plug in (internal pull-up)"}
  5:  {net: I2S_WS}
  6:  {net: I2S_BCLK}
  7:  {net: I2S_DIN, note: "from ES8311 ASDOUT (record)"}
  8:  {net: BUZZER, note: "NPN base via 1k (piezo next to the USB-C)"}
  9:  {net: KEY_3}
  10: {net: KEY_4}
  11: {net: KEY_5}
  12: {net: KEY_MENU}
  13: {net: EPD_CLK}
  14: {net: EPD_DIN}
  15: {net: I2S_DOUT, note: "to ES8311 DSDIN (playback)"}
  16: {net: I2S_MCLK}
  17: {net: I2C_SCL, pull: up}
  18: {net: I2C_SDA, pull: up, note: "ES8311 only; 4.7k pull-up"}
  19: {net: USB_DN, note: "native USB D- (flashing + USB-Serial-JTAG console)"}
  20: {net: USB_DP, note: "native USB D+"}
  21: {net: EPD_DC}
  35: {net: null, note: "reserved: octal PSRAM"}
  36: {net: null, note: "reserved: octal PSRAM"}
  37: {net: null, note: "reserved: octal PSRAM"}
  38: {net: EPD_RST}
  39: {net: KEY_BACK}
  40: {net: KEY_0}
  41: {net: KEY_9}
  42: {net: KEY_8}
  43: {net: KEY_6, note: "TXD0: the ROM boot log drives it for a moment after reset; a key held then only loses the log (burn EFUSE_UART_PRINT_CONTROL to silence it)"}
  44: {net: KEY_7, note: "RXD0 (input at boot)"}
  45: {net: null, note: "free (VDD_SPI strap: only low-only circuits may use it)"}
  46: {net: KEY_2, strap: true, low_only: true, note: "boot-mode strap (default low); a key can only pull it low"}
  47: {net: EPD_CS}
  48: {net: EPD_BUSY}

# I2C devices (7-bit)
i2c_expected:
  ES8311: 0x18
