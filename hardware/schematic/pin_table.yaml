# ESP32-S3-WROOM-1-N16R8 pin allocation, transcribed from hardware/DESIGN.md §5.
# checks.py fails the build if the schematic's module pad nets differ from this table.
#
# net:    net name the GPIO must connect to (None/omitted = must be unconnected)
# adc1:   signal is analog; GPIO must be on ADC1 (GPIO1-10, usable with Wi-Fi)
# rtc:    signal is a deep-sleep wake source; GPIO must be an RTC GPIO (0-21)
# strap:  required resistor at reset: pullup | pulldown (value checked loosely)
# board:  where the signal ends up (main | tp); one board since 2026-09-27

# GPIO assignment follows the board geometry (layout/pinswap.py, 2026-09-28): each signal
# leaves the module on the side facing what it connects to. Fixed: straps 0/3/45/46, PSRAM
# 35-37, native USB 19/20, UART0 43/44, CC sense on ADC1 1/2.
gpio:
  0:  {net: BOOT, strap: pullup, board: main, note: "10k pull-up + BOOT button; runtime long-press = factory reset"}
  1:  {net: I2S_DOUT, board: main}
  2:  {net: I2S_WS, board: main}
  3:  {net: HS_VBUS_EN, strap: pulldown, board: main, note: "handset port VBUS switch; strap only if EFUSE_STRAP_JTAG_SEL burned; 100k pull-down (off at boot)"}
  4:  {net: I2S_DIN, board: main}
  5:  {net: IRQ, rtc: true, board: main, pull: up}
  6:  {net: CC2_SENSE, adc1: true, board: main}
  7:  {net: I2C_SCL, board: main, pull: up}
  8:  {net: CC1_SENSE, adc1: true, board: main}
  9:  {net: null, note: "free"}
  10: {net: HS_VBUS_SENSE, adc1: true, board: main, note: "handset VBUS via 100k/100k"}
  11: {net: I2S_MCLK, board: main}
  12: {net: null, note: "free"}
  13: {net: null, note: "free"}
  14: {net: I2S_BCLK, board: main}
  15: {net: I2C_SDA, board: main, pull: up}
  16: {net: PGOOD, board: main, pull: up}
  17: {net: HOOK, rtc: true, board: main}
  18: {net: CHG_STAT, board: main, pull: up}
  19: {net: HS_USB_DN, board: main, note: "native USB OTG = host for the USB-C (UAC) handset port"}
  20: {net: HS_USB_DP, board: main}
  21: {net: LED_DATA, board: main, note: "via SN74LV1T125 buffer on main"}
  35: {net: null, note: "reserved: octal PSRAM"}
  36: {net: null, note: "reserved: octal PSRAM"}
  37: {net: null, note: "reserved: octal PSRAM"}
  38: {net: PA_EN, pulldown: true, board: main, note: "100k pull-down: amp off at boot"}
  39: {net: EPD_BUSY, board: main}
  40: {net: EPD_RST, board: main}
  41: {net: EPD_CS, board: main}
  42: {net: EPD_SCK, board: main}
  43: {net: U0TXD, board: tp}
  44: {net: U0RXD, board: tp}
  45: {net: CHG_CE, strap: pulldown, board: main, note: "must be low at reset (3.3 V flash)"}
  46: {net: null, note: "strap: left open, internal pull-down (radar removed 2026-09-28)"}
  47: {net: EPD_MOSI, board: main}
  48: {net: EPD_DC, board: main}

# I2C devices (7-bit). checks.py verifies no two parts on one bus share an address.
i2c_expected:
  ES8311: 0x18
  LIS2DH12: 0x19
  LTR-303ALS: 0x29
  MAX17048: 0x36
  ES7210: 0x40
  ST25DV04K: [0x53, 0x57, 0x2D]
  AW9523B: 0x58
