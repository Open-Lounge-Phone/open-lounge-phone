# ESP32-S3-WROOM-1-N16R8 pin allocation, transcribed from hardware/DESIGN.md §5.
# checks.py fails the build if the schematic's module pad nets differ from this table.
#
# net:    net name the GPIO must connect to (None/omitted = must be unconnected)
# adc1:   signal is analog; GPIO must be on ADC1 (GPIO1-10, usable with Wi-Fi)
# rtc:    signal is a deep-sleep wake source; GPIO must be an RTC GPIO (0-21)
# strap:  required resistor at reset: pullup | pulldown (value checked loosely)
# board:  where the signal ends up (main | tp); one board since 2026-09-27

gpio:
  0:  {net: BOOT, strap: pullup, board: main, note: "10k pull-up + BOOT button; runtime long-press = factory reset"}
  1:  {net: CC1_SENSE, adc1: true, board: main}
  2:  {net: CC2_SENSE, adc1: true, board: main}
  3:  {net: HS_VBUS_EN, strap: pulldown, board: main, note: "handset port VBUS switch; strap only if EFUSE_STRAP_JTAG_SEL burned; 100k pull-down (off at boot)"}
  4:  {net: HS_VBUS_SENSE, adc1: true, board: main, note: "handset VBUS via 100k/100k"}
  5:  {net: HOOK, rtc: true, board: main}
  6:  {net: LD_OUT, rtc: true, board: main}
  7:  {net: IRQ, rtc: true, board: both, pull: up}
  8:  {net: I2C_SDA, board: both, pull: up}
  9:  {net: I2C_SCL, board: both, pull: up}
  10: {net: EPD_CS, board: main}
  11: {net: EPD_MOSI, board: main}
  12: {net: EPD_SCK, board: main}
  13: {net: EPD_DC, board: main}
  14: {net: EPD_RST, board: main}
  15: {net: EPD_BUSY, board: main}
  16: {net: I2S_MCLK, board: main}
  17: {net: I2S_BCLK, board: main}
  18: {net: I2S_WS, board: main}
  19: {net: HS_USB_DN, board: main, note: "native USB OTG = host for the USB-C (UAC) handset port"}
  20: {net: HS_USB_DP, board: main}
  21: {net: I2S_DOUT, board: main}
  35: {net: null, note: "reserved: octal PSRAM"}
  36: {net: null, note: "reserved: octal PSRAM"}
  37: {net: null, note: "reserved: octal PSRAM"}
  38: {net: I2S_DIN, board: main}
  39: {net: LD_RX, board: main}
  40: {net: LD_TX, board: main}
  41: {net: PA_EN, strap_like: pulldown, board: main, note: "100k pull-down: amp off at boot"}
  42: {net: LED_DATA, board: main, note: "via SN74LV1T125 buffer on main"}
  43: {net: U0TXD, board: tp}
  44: {net: U0RXD, board: tp}
  45: {net: CHG_CE, strap: pulldown, board: main, note: "must be low at reset (3.3 V flash)"}
  46: {net: LD_PWR_EN, strap: pulldown, board: main}
  47: {net: CHG_STAT, board: main, pull: up}
  48: {net: PGOOD, board: main, pull: up}

# I2C devices (7-bit). checks.py verifies no two parts on one bus share an address.
i2c_expected:
  ES8311: 0x18
  LIS2DH12: 0x19
  LTR-303ALS: 0x29
  MAX17048: 0x36
  ES7210: 0x40
  ST25DV04K: [0x53, 0x57, 0x2D]
  AW9523B: 0x58
  ATECC608B: 0x60
# Optional external modules on the board's DNP Qwiic port (owner decision 2026-09-27). They are not
# on either board, but the bus must leave their addresses free, so the uniqueness check reserves
# them: SSD1306 0.91" OLED (0x3C; 0x3D if its SA0 jumper is moved), HT16K33 backpack (0x70 base).
i2c_optional_external:
  SSD1306: 0x3C
  HT16K33: 0x70
