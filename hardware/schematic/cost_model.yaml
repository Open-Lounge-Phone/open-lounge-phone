# Cost roll-up assumptions for cost.py (owner: $28-40 per phone is fine; affordable to build ONE,
# cheap at scale). Part prices come from lcsc_cache.json (JLCPCB assembly ladder first, then
# LCSC). Everything in this file is an ESTIMATE (EST), dated; re-quote before relying on it.
# JLCPCB is the reference quote, not a requirement.
date: 2026-09-30
quantities: [1, 100, 1000]

pcb:        # 2-layer FR-4 1.6 mm, HASL lead-free, 160 x 88 mm (jlcpcb.com list prices, EST)
  min_order: 5
  order_usd: {1: 7.00, 100: 40.00, 1000: 220.00}   # whole order: 5 pcs, 100 pcs, 1000 pcs
shipping_usd: {1: 18.00, 100: 30.00, 1000: 60.00}

assembly:   # JLCPCB "Economic" PCBA, ONE side (all SMD parts on the bottom, see DESIGN.md §9)
  min_boards: 2             # smallest PCBA quantity
  setup_usd: 8.00
  stencil_usd: 1.50
  extended_fee_usd: 3.00    # per unique extended-library part per order
  per_joint_usd: 0.0017
  tht_setup_usd: 3.50       # through-hole soldering (header, piezo), per order
  tht_per_joint_usd: 0.0173
  tht_refs_prefix: [BZ, J3] # THT parts (J3 = display header); the rest is SMD

# Off-board parts per phone (not on the PCB), EST: at-scale / retail single unit
off_board:
  mx_switches_x13:       {scale: 2.60, retail: 5.20}   # 12 keys + hook
  keycaps_x12:           {scale: 1.44, retail: 3.60}
  display_module_2in9:   {scale: 6.00, retail: 15.00}  # WeAct ~$8, Waveshare ~$15 (retail)
  antenna_2g4_ufl:       {scale: 0.45, retail: 2.50}
  handset_trrs_analog:   {scale: 4.00, retail: 29.90}  # e.g. Opis 60s Micro retail; OEM at scale: guess
