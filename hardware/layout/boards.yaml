# Board-level layout definition (outline, holes, keep-outs, zones, net classes, key grid).
# Coordinates are mm, board-relative: x right, y DOWN from the board's top-left corner.
# Main board: top edge = rear wall (2x USB-C, ESP32 antenna), bottom edge = front (radar, mic),
# right edge = VOL-/VOL+/MUTE. Deck board: top edge = rear key row, bottom edge = front key row.
# Component positions live in placement.yaml.

# Design rules = intersection of common 4-layer capabilities (JLCPCB, PCBWay, OSH Park,
# Eurocircuits, Aisler, Seeed, NextPCB ...); see fab-common.kicad_dru and LAYOUT.md.
rules:
  min_track: 0.15
  min_clearance: 0.15
  min_via_diameter: 0.6
  min_via_drill: 0.3
  min_hole: 0.3
  min_annular: 0.15
  edge_clearance: 0.3
  hole_to_hole: 0.5
  silk_min_text: 0.8

netclasses:
  # name: [track, clearance, via_d, via_drill]; GUIDELINES.md §5
  Default: {track: 0.2, clearance: 0.15, via: [0.6, 0.3]}
  Bus: {track: 0.2, clearance: 0.2, via: [0.6, 0.3]}
  USB: {track: 0.27, clearance: 0.15, via: [0.6, 0.3], diff_pair: [0.27, 0.15]}
  # GUIDELINES asks 0.25/0.3 mm for analog audio; 0.2/0.2 mm is what the 0.4 mm-pitch
  # ES7210/ES8311 pins allow (see LAYOUT.md). Analog runs are guarded by the L1/L4 GND pours.
  Audio: {track: 0.2, clearance: 0.2, via: [0.6, 0.3]}
  Power3V: {track: 0.4, clearance: 0.2, via: [0.6, 0.3]}
  Power: {track: 0.6, clearance: 0.25, via: [0.6, 0.3]}
  Speaker: {track: 0.5, clearance: 0.25, via: [0.6, 0.3]}
  GND: {track: 0.4, clearance: 0.15, via: [0.6, 0.3]}

netclass_rules:
  # regex on the net name, then pad-based rules for auto-named nets (checked in order)
  - {class: GND, pattern: "^GND$"}
  - {class: Power, pattern: "^(VBUS|VBUS_C|VSYS|VBAT|SCAP|VBUS_LD|VLED|HS_VBUS|HS_VIN)$"}
  - {class: Power3V, pattern: "^(3V3|3V0)$"}
  - {class: USB, pattern: "^(HS_)?USB_D[PN](_C)?$"}
  - {class: Speaker, pattern: "^SPK_VO[PN]$"}
  - {class: Speaker, pads: {U9: ["5", "8"]}}        # NS4150B VON/VOP before the beads
  - {class: Audio, pattern: "^(BASEMIC_|DAC_OUT|REF_|PA_IN_|MICBIAS)"}
  - {class: Audio, pads: {U7: ["15", "16", "19", "20", "27", "28", "31", "32"], U9: ["3", "4"]}}
  - {class: Bus, pattern: "^(I2C_|I2S_|EPD_(CS|MOSI|SCK|DC|RST|BUSY)$|LED_D|LED_DATA|IRQ|U0|LD_RX|LD_TX)"}
  - {class: Bus, pads: {J5: ["1", "2", "3"]}}

stackup:
  # generic 1.6 mm 4-layer, 7628 prepreg (JLC04161H-7628 / PCBWay standard class)
  finish: ENIG
  layers:
    - [F.Cu, copper, 0.035]
    - [prepreg, 0.2104, 4.4]
    - [In1.Cu, copper, 0.0152]
    - [core, 1.065, 4.6]
    - [In2.Cu, copper, 0.0152]
    - [prepreg, 0.2104, 4.4]
    - [B.Cu, copper, 0.035]

main:
  title: "Open Lounge Phone board"
  netlist: main
  # Single board (owner decision 2026-09-27): one 180 x 88 mm 4-layer board with the keys on
  # it (the former deck is merged in; no FFC/standoffs). Compact base A (base 186 x 94 x 33 mm);
  # prototype box: enclosure/proto_box.py (lid = MX plate at board top + 5.0, 3.0 mm under the
  # lid, 7.0 mm under the board).
  # Zones: keys at x 42.4 + 19.05 i, rows y 14.8 / 72.8 (switch bodies keep the 14 x 14 squares
  # free on the top side); e-ink panel (at plate level, parts <= 2.8 mm may sit under it) over
  # x 41-120, y 25.45-62.15; left end: handset USB-C, NFC coil (front-left); right end: power
  # USB-C, power path, hall, CH340C, RESET/BOOT, mic, radar, side controls (bottom side).
  size: [180, 88]
  corner_radius: 8.5      # clears the shell's inner corner radius
  hook_post_x: 171.0      # hall U10 at (171.0, 18.8) under the right-hand plunger
  holes:   # M2.5 plated, GND; [x, y]
    - [34.7, 5.0]     # support / plate screws (the old deck standoff positions)
    - [145.3, 5.0]
    - [34.7, 82.6]
    - [145.3, 82.6]
    - [145.1, 29.4]
    - [5.0, 29.8]     # shell bolts: tray -> board -> lid/top shell
    - [26.0, 29.8]
    - [154.0, 29.8]
    - [176.0, 29.8]
  hole_keepout_d: 6.0
  place_gap: 0.25        # auto-placed passives: courtyard gap to each other (routing channels)
  fine_pitch_gap: 0.8    # ... and to fine-pitch ICs (QFN pins need escape room)
  # 12 keys in two rows of six (owner decision 2026-09-27): rear 1 2 3 4 5 MENU, front
  # 6 7 8 9 0 BACK; the old deck origin (31.5, 1.8) is kept, so the key grid is unchanged.
  keys:
    pitch: 19.05
    x0: 42.4
    y_rear: 14.8
    y_front: 72.8
    led_offset: [0, 5.08]   # SK6812MINI-E centre relative to the switch centre (top view)
    body: 13.5              # MX switch bottom housing (~13.8): no top-side parts inside this square
  # e-ink panel outline (GDEY029T94 79.0 x 36.7) at plate level, centred over the digit columns
  panel: [41.0, 25.45, 120.0, 62.15]
  keepouts:
    # NFC loop (front-left end region): no pours on any layer (a plane inside the loop is a
    # shorted turn); nothing on L1 (the coil) and L2 (plane cut-out). L3/L4 may carry signal
    # tracks straight across (no vias, no GND/supply nets: router.py NO_SUPPLY_AREAS).
    - {name: NFC_LOOP, rect: [2.2, 37.7, 28.8, 80.3], tracks: false, vias: false, pours: false,
       footprints: false, layers: [F.Cu, In1.Cu]}
    - {name: NFC_LOOP_SIG, rect: [2.2, 37.7, 28.8, 80.3], tracks: true, vias: false,
       pours: false, footprints: false, layers: [In2.Cu, B.Cu]}
    # slit from the loop to the left board edge on every layer: the pours around the coil must
    # not form a closed (shorted) turn around it
    - {name: NFC_SLIT, rect: [-0.5, 58.5, 2.5, 59.5], tracks: true, vias: false, pours: false}
  testpoints:   # pogo grid on the bottom, 2.54 mm pitch; USB nets stay on top (no stubs)
    origin: [104.0, 24.5]
    cols: 6
    pitch: 2.54
    side: bottom
    top_nets: [USB_DP, USB_DN, HS_USB_DP, HS_USB_DN]
  zones:
    # [net, layer, polygon | "board", priority]
    - [GND, In1.Cu, board, 0]
    - [GND, F.Cu, board, 0]
    - [GND, B.Cu, board, 0]
    - [GND, In2.Cu, board, 0]
    - [3V3, In2.Cu, [[36, 23], [146, 23], [146, 65], [36, 65]], 1]
    - [VSYS, In2.Cu, [[147.5, 12], [172, 12], [172, 44], [147.5, 44]], 1]
  stitch_pitch: 5.0
  logos:   # owner's signature (hardware/art/make_logo.py): [footprint, x, y, side]
    - [openloungephone_logo_B, 60.0, 44.0, bottom]
  texts:
    - ["Open Lounge Phone", 60.0, 50.6, 1.5, bottom]
    - ["board r0.2  CERN-OHL-S-2.0", 60.0, 53.6, 1.0, bottom]
    - ["HANDSET", 24.0, 9.0, 0.8, bottom]
    - ["PWR / PROG", 159.0, 9.0, 0.8, bottom]
    - ["NFC", 15.5, 59.0, 1.5]
    - ["HOOK", 171.0, 24.0, 0.8, bottom]
    - ["RST", 157.0, 51.8, 0.8]
    - ["BOOT", 165.0, 51.8, 0.8]
    - ["TEST PADS 2.54 mm", 110.0, 23.2, 0.8, bottom]
    - ["DNP by variant: e-ink J6+boost, Qwiic J3, radar J5 Q2 Q3, supercap C7, battery J2 U14", 90.0, 86.4, 0.8, bottom]

plate:
  title: "Open Lounge Phone key plate (FR4 1.5 mm, no copper)"
  size: [117, 84]
  corner_radius: 1.5
  cutout: 14.0          # MX plate cutout
  origin: [31.5, 1.8]   # plate (0,0) in board coordinates; keys/panel/holes follow the board
  holes: [[3.2, 3.2], [113.8, 3.2], [3.2, 80.8], [113.8, 80.8]]
  holes_d: 2.7          # M2.5 clearance at deck holes 1-4 (countersink for flush heads)
  # deck hole 5 is screwed before the plate goes on (no plate hole: the web would be 0.4 mm)
  pocket_clearance: 0.2 # e-ink pocket = 79.0 x 36.7 panel outline + 0.2 mm all round
  light_holes:          # [x, y, d] in plate coordinates: status LED, privacy LED, ALS
    - [96.5, 48.2, 3.2]
    - [110.0, 51.6, 2.0]
    - [110.0, 56.0, 2.0]
