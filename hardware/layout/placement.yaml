# Component placement: ref: [x, y, rotation_deg, side]  (side defaults to top)
# Board-relative mm, x right, y DOWN from the top-left corner (see boards.yaml for outlines).
# Grouped by functional block; every netlist ref must appear (the deck key grid - sockets,
# key LEDs, their caps and key pull-ups - is generated from boards.yaml `keys`).
# All footprints of all variants are placed; variants differ only by DNP.

main:
  # Single board (owner decision 2026-09-27), 180 x 88 mm, R8.5 corners. Key sockets, key LEDs,
  # their caps and the key pull-ups come from the key grid (boards.yaml `keys`); resistors,
  # capacitors, beads, small transistors and test pads are placed automatically next to the pin
  # they serve (build_board.auto_place); list a ref here to pin it by hand.
  # Proto box rules (enclosure/proto_box.py): top parts <= 3.0 mm (<= 3.8 with a lid pocket),
  # under the e-ink panel <= 2.8 mm; tall parts (JST-PH, supercap, side controls) on the bottom.
  # ---- left end: handset USB-C (host, x = 24) + ESD + current-limited VBUS ---------------
  handset:
    J7: [24.0, 3.15, 180]         # handset USB-C (UAC host), rear edge x = 24
    D7: [24.0, 12.0, 0]           # SRV05-4 at the connector
    U15: [13.0, 11.5, 0]          # SY6280 handset VBUS switch
    D8: [13.0, 17.0, 0]           # handset supply diode-OR (VBUS / VSYS)
    D9: [13.0, 21.5, 0]
    J2: [8.5, 16.0, 90, bottom]   # B-option battery JST-PH-3 (bottom: 7 mm under the board)
  # ---- right end: power USB-C (sink, x = 159) + ESD + power path + USB-UART -------------------
  usb:
    J1: [159.0, 3.15, 180]        # power / programming USB-C
    D1: [161.0, 11.2, 90]         # USBLC6 D+/D- at the connector
    D2: [155.5, 11.2, 90]         # USBLC6 CC1/CC2 at the connector
    U16: [163.0, 37.5, 0]         # CH340C USB-UART (power port -> UART0, auto-reset)
  power:
    F1: [151.5, 10.5, 90]         # PTC at the VBUS entry
    D3: [151.5, 16.5, 90]         # SMF5.0A TVS
    U2: [158.5, 21.0, 0]          # BQ24074
    U3: [160.5, 27.3, 0]          # TLV62569 buck
    L1: [166.0, 27.3, 0]
    U14: [150.5, 39.5, 0]         # MAX17048 (B-option)
    C7: [112.0, 45.0, 0, bottom]  # supercap hold-up (Lounge), bottom side
  # ---- ESP32-S3-WROOM-1U between the key rows, right of the e-ink panel ------------------------
  mcu:
    U1: [132.0, 34.2, 0]
    SW1: [157.0, 46.8, 90]        # RESET pinhole (enclosure position)
    SW2: [165.0, 46.8, 90]        # BOOT pinhole
    U13: [110.0, 36.0, 0]         # ATECC608B (DNP)
    U5: [56.0, 26.5, 0]           # SN74LV1T125 LED-data buffer (chain starts at key 1)
  # ---- audio under the e-ink panel; speaker under the board (centre, bottom) -------------------
  audio:
    U7: [75.0, 44.0, 0]           # ES7210
    U6: [75.0, 56.0, 0]           # ES8311
    U4: [66.0, 50.0, 0]           # LP5907 3V0
    U9: [58.0, 36.0, 0]           # NS4150B
    J4: [54.0, 44.0, 90, bottom]  # speaker JST-PH-2 (bottom, next to the speaker)
    MK1: [155.0, 58.8, 0]         # base electret (enclosure port position)
  # ---- keys / LEDs / display / NFC (the former deck) -------------------------------------------
  ui:
    U17: [92.0, 29.0, 0]          # AW9523B
    Q7: [46.0, 56.0, 0]           # VLED P-FET gate
    Q8: [46.0, 60.0, 0]
    D21: [128.0, 50.0, 0, bottom] # status SK6812MINI-E (reverse mount, light hole in the lid)
    D22: [141.5, 53.4, 0]         # privacy LED
    U18: [141.5, 57.8, 0]         # LTR-303ALS
    J3: [131.0, 60.0, 180]        # Qwiic display port (DNP)
    J6: [37.8, 43.8, 90]          # e-ink FPC (panel tail folds down at the panel's left end)
    L3: [46.0, 30.0, 0]           # e-ink boost
    Q9: [46.0, 35.0, 0]
    D23: [51.0, 31.0, 90]
    D24: [51.0, 36.0, 90]
    D25: [51.0, 41.0, 90]
    L2: [15.5, 59.0, 0]           # NFC PCB coil (front-left end region)
    U19: [38.5, 61.5, 0]          # ST25DV04K next to the coil terminals
  # ---- hook sensing under the right-hand plunger ------------------------------------------------
  sensors:
    U10: [171.0, 18.8, 0]         # DRV5032 hall
    U11: [177.0, 19.0, 0]         # ITR8307 IR option (DNP)
    U12: [104.0, 56.0, 0]         # LIS2DH12
  # ---- side controls on the right edge, bottom side (enclosure: y 70.8 / 62.8 / 53.8) ---------
  side:
    SW3: [177.6, 70.8, 270, bottom]  # VOL- (270 on the bottom = actuator at the edge)
    SW4: [177.6, 62.8, 270, bottom]  # VOL+
    SW5: [174.5, 51.3, 270, bottom]  # MUTE (body centred on y 53.8), right-angle DPDT (lever out through the edge)
    D5: [170.0, 59.5, 90, bottom]    # SRV05-4 at the switches
  # ---- radar (Lounge) -----------------------------------------------------------------------
  radar:
    J5: [162.0, 66.4, 90]

# ---- hand-specified critical routes (locked; the router routes around them) -----------------
routes:
  main: []
