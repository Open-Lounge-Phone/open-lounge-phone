# Component placement: ref: [x, y, rotation_deg, side]  (side defaults to top)
# Board-relative mm, x right, y DOWN from the top-left corner (see boards.yaml for outlines).
# Grouped by functional block; every netlist ref must appear (the key grid - sockets, key
# LEDs, their caps and key pull-ups - is generated from boards.yaml `keys`).

main:
  # Single board (owner decision 2026-09-27), 180 x 88 mm, R8.5 corners. Key sockets, key LEDs
  # and their caps come from the key grid (boards.yaml `keys`); resistors,
  # capacitors, beads, small transistors and test pads are placed automatically next to the pin
  # they serve (build_board.auto_place); list a ref here to pin it by hand.
  # Proto box rules (enclosure/proto_box.py): top parts <= 3.0 mm (<= 3.8 with a lid pocket),
  # under the e-ink panel <= 2.8 mm; tall parts (JST-PH, side controls) on the bottom.
  # Floorplan A3 (owner, 2026-09-28): one board, one BOM. Every connection short and direct,
  # blocks as local clusters, only a few buses between them (LAYOUT.md §5 plan table).
  #   right end: both USB-C (handset on the rear wall next to the ESP32, power on the right
  #   wall), power chain + fuel gauge, USB-UART, hall, AW9523B at the end of the key rows, base
  #   mic by the MUTE switch; ESP32 right of the panel with the codecs below it; NFC coil at the
  #   left end; 1S pack under the board (x 103-143, y 24-54).
  # ---- ESP32-S3-WROOM-1U right of the e-ink panel, rotated 180: native USB (pins 13/14) at its
  #      top-right corner facing J7; U.FL at the bottom ---------------------------------------------
  mcu:
    U1: [131.5, 32.3, 180]
    C14: [142.3, 39.4, 90]        # module 3V3 (pin 2): 100 nF at the pin, 22 uF bulk beside it
    C13: [144.4, 39.4, 90]
    SW1: [158.5, 12.5, 90]        # RESET pinhole (lid), rear right
    SW2: [158.5, 20.8, 90]        # BOOT pinhole
    U5: [128.1, 17.4, 90]         # SN74LV1T125 LED-data buffer, between keys 5 and MENU (chain starts at MENU)
    R22: [128.1, 20.6, 0]         # LED data series resistor, then down to the MENU LED
  # ---- handset USB-C (host) on the rear wall next to the ESP32 --------------------------------
  handset:
    J7: [153.8, 3.15, 180]        # handset USB-C (UAC host), rear edge x = 153.8 (clear of hole H2)
    D7: [151.8, 11.9, 270]        # SRV05-4 at the connector, I/O pins facing the pair corridor
    U15: [152.4, 16.3, 0]         # SY6280 handset VBUS switch, beside the pair corridor
    D8: [152.5, 20.5, 0]          # handset supply diode-OR (VBUS / VSYS)
    D9: [152.5, 23.5, 0]
  # ---- power: USB-C on the right wall -> ESD -> PTC/TVS -> BQ24074 -> buck; fuel gauge and the
  #      battery connector beside the charger; the pack lies under the board (x 103-143) --------
  usb:
    J1: [176.85, 40.0, 90]        # power / programming USB-C, right wall at y = 40
    D1: [168.8, 38.0, 0]          # USBLC6 D+/D- at the connector pins
    D2: [168.8, 42.3, 0]          # USBLC6 CC1/CC2
    U16: [165.0, 28.5, 90]        # CH340C between holes H8/H9, USB pins on its bottom edge (toward J1)
  power:
    F1: [168.0, 34.4, 0]          # PTC at the VBUS entry
    D3: [163.0, 34.4, 0]          # SMF5.0A TVS
    U2: [162.0, 40.0, 0]          # BQ24074 (power path + 1S charger)
    U3: [157.5, 47.0, 0]          # TLV62569 buck + inductor below the charger
    L1: [163.0, 47.0, 0]
    U14: [150.0, 38.2, 0]         # MAX17048 fuel gauge on VBAT, beside the charger
    J2: [150.0, 46.0, 90, bottom] # 1S LiPo JST-PH-3 (bottom), at the pack's right end
  # ---- audio: codec cluster below the ESP32 (I2S short), ES7210 on the right toward the mic;
  #      base mic between the codecs and the MUTE switch; amp + speaker JST at the panel end ----
  audio:
    U6: [126.0, 48.5, 180]        # ES8311: DAC outputs face left to the amp, I2S/I2C face the module
    U7: [135.5, 48.5, 0]          # ES7210: mic/MICBIAS pins face right (mic), I2S/I2C face left/down
    U4: [131.0, 57.0, 0]          # LP5907 3V0 for the codecs
    C17: [129.0, 49.9, 270]       # ES8311 PVDD / DVDD 100 nF, one per pin (pins 3/4), supply pad at the pin
    C18: [129.0, 46.5, 90]
    C24: [131.9, 47.9, 90]        # ES7210 VDDP / VDDD 100 nF, one per pin (pins 6/7)
    C25: [131.9, 51.2, 270]
    U9: [116.0, 57.8, 0]          # NS4150B under the panel end: DAC in from the right, outputs to J4
    J4: [108.0, 60.0, 90, bottom] # speaker JST-PH-2 (bottom), beside the speaker
    C49: [110.4, 55.2, 90]        # speaker EMI caps on top over the connector
    C50: [110.4, 58.8, 90]
    MK1: [152.0, 62.5, 0]         # base electret (lid pinhole) between the ES7210 and the MUTE switch
    R31: [148.6, 67.6, 0]         # mic bias feed (MICBIAS_F -> BASEMIC_P) + RC filter at the mic
    R28: [152.0, 67.6, 0]
    C34: [155.4, 67.6, 0]
    C35: [147.6, 60.2, 90]        # 33 pF RF cap at the capsule
    NT1: [156.6, 62.5, 0]         # mic return tied to GND at the capsule
  # ---- keys / LEDs / display / NFC --------------------------------------------------------------
  ui:
    U17: [147.5, 52.4, 0]         # AW9523B at the right end of the key rows: both row buses run straight to it
    Q3: [154.2, 52.2, 0]          # VLED P-FET gate driver next to LED_PWR_EN on the AW9523B
    Q2: [154.2, 56.4, 0]          # VLED P-FET: short necks to both VLED strips' right ends
    C61: [157.8, 53.0, 90]        # VLED bulk on top beside the FET
    C62: [157.8, 56.6, 90]
    U12: [121.5, 63.6, 0]         # LIS2DH12 on the I2C spine below the codecs
    C52: [122.3, 60.6, 90]        # LIS2DH12 VDD 100 nF at pin 10
    D20: [127.0, 62.8, 0, bottom] # status SK6812MINI-E (reverse mount, light hole in the lid)
    U18: [140.0, 63.6, 0]         # LTR-303ALS under its lid light hole, on the I2C spine
    D21: [158.5, 67.5, 0]         # privacy LED beside the mic (MICBIAS_OUT), lid light hole
    J6: [119.4, 43.8, 270]        # e-ink FPC at the panel tail (panel right end, tail folds under)
    L3: [110.6, 31.0, 0]          # e-ink boost next to the ZIF
    Q7: [110.6, 36.0, 0]
    D22: [106.0, 31.0, 90]
    D23: [106.0, 36.0, 90]
    D24: [106.0, 41.0, 90]
    L2: [15.5, 59.0, 0]           # NFC PCB coil (front-left end region)
    U19: [38.5, 61.5, 0]          # ST25DV04K at the coil terminals (antenna leads stay short)
  # ---- hook sensing under the right-hand plunger ------------------------------------------------
  sensors:
    U10: [171.0, 18.8, 0]         # DRV5032 hall
  # ---- side controls on the right edge, bottom side (enclosure: y 70.8 / 62.8 / 53.8) ---------
  side:
    SW3: [177.6, 70.8, 270, bottom]  # VOL- (270 on the bottom = actuator at the edge)
    SW4: [177.6, 62.8, 270, bottom]  # VOL+
    SW5: [174.5, 51.3, 270, bottom]  # MUTE (body centred on y 53.8), right-angle DPDT (lever out through the edge)
    D4: [167.0, 61.0, 0]             # SRV05-4 above the switches (top side)
    R27: [169.0, 56.0, 90]           # MICBIAS_OUT bleed at the MUTE switch (top side)

# ---- hand-specified critical routes (locked; the router routes around them) -----------------
# The handset pair HS_USB_DP/DN (J7 -> D7 -> U1 pins 14/13) is routed in step B through the
# reserved HS_USB_CORRIDOR (boards.yaml keep-outs): L1 only, no vias, <= ~25 mm, 90 ohm.
routes:
  main: []
