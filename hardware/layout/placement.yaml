# Component placement: ref: [x, y, rotation_deg, side]  (side defaults to top)
# Board-relative mm, x right, y DOWN from the top-left corner (see boards.yaml for outlines).
# Grouped by functional block; every netlist ref must appear (the deck key grid - sockets,
# key LEDs, their caps and key pull-ups - is generated from boards.yaml `keys`).
# All footprints of all variants are placed; variants differ only by DNP.

main:
  # Single board (owner decision 2026-09-27), 180 x 88 mm, R8.5 corners. Key sockets, key LEDs
  # and their caps come from the key grid (boards.yaml `keys`); resistors,
  # capacitors, beads, small transistors and test pads are placed automatically next to the pin
  # they serve (build_board.auto_place); list a ref here to pin it by hand.
  # Proto box rules (enclosure/proto_box.py): top parts <= 3.0 mm (<= 3.8 with a lid pocket),
  # under the e-ink panel <= 2.8 mm; tall parts (JST-PH, supercap, side controls) on the bottom.
  # Floorplan A2 (owner, 2026-09-28): every connection short and direct, blocks as local
  # clusters, only a few buses between them (LAYOUT.md §5 plan table).
  #   right end: both USB-C (handset on the rear wall next to the ESP32, power on the right
  #   wall), power chain, USB-UART, hall; ESP32 right of the panel; codec cluster + amp +
  #   speaker connector directly below the ESP32; mic and NFC at the left end; AW9523B centred.
  # ---- ESP32-S3-WROOM-1U right of the e-ink panel, rotated 180: native USB (pins 13/14) at its
  #      top-right corner facing J7; U.FL at the bottom ---------------------------------------------
  mcu:
    U1: [131.5, 32.3, 180]
    C15: [142.3, 39.4, 90]        # module 3V3 (pin 2): 100 nF at the pin, 22 uF bulk beside it
    C14: [144.4, 39.4, 90]
    SW1: [158.5, 12.5, 90]        # RESET pinhole (lid), rear right
    SW2: [158.5, 20.8, 90]        # BOOT pinhole
    U5: [128.1, 17.4, 90]         # SN74LV1T125 LED-data buffer, between keys 5 and MENU (chain starts at MENU)
    R26: [128.1, 20.6, 0]         # LED data series resistor, then down to the MENU LED
  # ---- handset USB-C (host) on the rear wall next to the ESP32 --------------------------------
  handset:
    J7: [153.8, 3.15, 180]        # handset USB-C (UAC host), rear edge x = 153.8 (clear of hole H2)
    D7: [151.8, 11.9, 270]        # SRV05-4 at the connector, I/O pins facing the pair corridor
    U15: [152.4, 16.3, 0]         # SY6280 handset VBUS switch, beside the pair corridor
    D8: [152.5, 20.5, 0]          # handset supply diode-OR (VBUS / VSYS)
    D9: [152.5, 23.5, 0]
  # ---- power USB-C on the right wall + power chain in signal-flow order ----------------------
  #      J1 -> USBLC6 D1 (D+/D-) / D2 (CC) -> PTC F1 + TVS D3 -> BQ24074 -> buck; CH340C above J1
  usb:
    J1: [176.85, 40.0, 90]        # power / programming USB-C, right wall at y = 40
    D1: [168.8, 38.0, 0]          # USBLC6 D+/D- at the connector pins
    D2: [168.8, 42.3, 0]          # USBLC6 CC1/CC2
    U16: [165.0, 28.5, 90]        # CH340C between holes H8/H9, USB pins on its bottom edge (toward J1)
  power:
    F1: [168.0, 34.4, 0]          # PTC at the VBUS entry
    D3: [163.0, 34.4, 0]          # SMF5.0A TVS
    U2: [162.0, 40.0, 0]          # BQ24074 (power path)
    U3: [157.5, 47.0, 0]          # TLV62569 buck + inductor below the charger
    L1: [163.0, 47.0, 0]
    U14: [149.4, 38.2, 0]         # MAX17048 (B-option) beside the charger and battery connector
    J2: [150.0, 46.0, 90, bottom] # B-option battery JST-PH-3 (bottom: 7 mm under the board)
    C7: [164.0, 55.0, 180, bottom] # supercap hold-up (Lounge), bottom side; THT pins clear of top parts
    R13: [149.6, 55.6, 0]         # supercap charge resistor + diode on top (fewer bottom parts)
    D4: [150.5, 60.0, 0]
  # ---- audio: codec cluster + amp + speaker connector below the ESP32 (I2S short); only the
  #      mic pair and MICBIAS run to the mic at the left end --------------------------------------
  audio:
    U7: [126.0, 48.5, 180]        # ES7210: mic/AEC inputs face left (mic) and down, I2S/I2C up
    U6: [135.0, 48.0, 270]        # ES8311: I2S toward U7 and the module, DAC outputs down to the amp
    U4: [130.5, 57.0, 0]          # LP5907 3V0 for the codecs
    C25: [130.2, 48.2, 0]         # ES7210 VDDP / VDDD 100 nF, one per pin (pins 6/7)
    C26: [130.2, 46.5, 0]
    C18: [135.6, 44.3, 90]        # ES8311 PVDD / DVDD 100 nF, one per pin (pins 3/4)
    C19: [133.9, 44.3, 90]
    U9: [116.0, 57.8, 0]          # NS4150B under the panel end: DAC in from the right, outputs to J4
    J4: [113.5, 58.0, 90, bottom] # speaker JST-PH-2 (bottom), right next to the speaker
    C56: [110.4, 55.2, 90]        # speaker EMI caps on top over the connector
    C57: [110.4, 58.8, 90]
    MK1: [19.5, 25.0, 0]          # base electret (lid pinhole) at the left end
    R35: [17.0, 30.2, 0]          # mic bias feed (MICBIAS_F -> BASEMIC_P) + RC filter at the mic
    R32: [21.4, 30.2, 0]
    C35: [19.2, 32.2, 0]
    C40: [19.2, 34.2, 0]          # 33 pF RF cap at the capsule
    NT1: [14.5, 25.0, 0]          # mic return tied to GND at the capsule
  # ---- middle band: keys / LEDs / display / NFC -------------------------------------------------
  ui:
    U17: [90.0, 43.8, 270]        # AW9523B centred between the key rows (I2C side faces the ESP32)
    Q8: [84.0, 50.5, 0]           # VLED P-FET gate driver (LED_PWR_EN from the AW9523B)
    Q7: [84.0, 55.0, 0]           # VLED P-FET
    C70: [79.6, 55.0, 90]         # VLED bulk on top beside the FET
    C71: [79.6, 58.6, 90]
    U13: [70.0, 57.0, 0]          # ATECC608B (DNP) on the I2C spine
    U12: [100.0, 58.0, 0]         # LIS2DH12 on the I2C spine
    D21: [127.0, 62.8, 0, bottom] # status SK6812MINI-E (reverse mount, light hole in the lid)
    D22: [110.0, 64.2, 0]         # privacy LED on the front band, on MICBIAS_OUT's way to the mic
    U18: [105.0, 64.2, 0]         # LTR-303ALS on the I2C spine (front band, lid light hole)
    J3: [37.0, 52.0, 180]         # Qwiic display port (DNP), on the I2C spine at its left end
    J6: [119.4, 43.8, 270]        # e-ink FPC at the panel tail (panel right end, tail folds under)
    L3: [110.6, 31.0, 0]          # e-ink boost next to the ZIF
    Q9: [110.6, 36.0, 0]
    D23: [106.0, 31.0, 90]
    D24: [106.0, 36.0, 90]
    D25: [106.0, 41.0, 90]
    L2: [15.5, 59.0, 0]           # NFC PCB coil (front-left end region)
    U19: [38.5, 61.5, 0]          # ST25DV04K next to the coil terminals
  # ---- hook sensing under the right-hand plunger ------------------------------------------------
  sensors:
    U10: [171.0, 18.8, 0]         # DRV5032 hall
  # ---- side controls on the right edge, bottom side (enclosure: y 70.8 / 62.8 / 53.8) ---------
  side:
    SW3: [177.6, 70.8, 270, bottom]  # VOL- (270 on the bottom = actuator at the edge)
    SW4: [177.6, 62.8, 270, bottom]  # VOL+
    SW5: [174.5, 51.3, 270, bottom]  # MUTE (body centred on y 53.8), right-angle DPDT (lever out through the edge)
    D5: [171.0, 61.0, 0]             # SRV05-4 above the switches (top side)
    R31: [171.4, 56.6, 90]           # MICBIAS_OUT bleed at the MUTE switch (top side)
  # ---- radar (Lounge) -----------------------------------------------------------------------
  radar:
    J5: [162.0, 66.4, 90]
    Q2: [156.2, 63.6, 0]          # radar 5 V switch + gate driver beside the socket
    Q3: [156.2, 59.4, 0]

# ---- hand-specified critical routes (locked; the router routes around them) -----------------
# The handset pair HS_USB_DP/DN (J7 -> D7 -> U1 pins 14/13) is routed in step B through the
# reserved HS_USB_CORRIDOR (boards.yaml keep-outs): L1 only, no vias, <= ~25 mm, 90 ohm.
routes:
  main: []
