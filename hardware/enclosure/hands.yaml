# Sculpted handset catches ("hands") for the cradle, from free models on Printables.
# Nothing here is committed but these settings: `make hands` downloads each model into
# build/hands/src/ and fuses its catch onto the standard arm (hands.py). Licenses as published;
# CC-BY needs the credit in build/hands/CREDITS.txt; CC-BY-SA remixes stay CC-BY-SA.
#   mode: pair = the piece and its mirror image either side of the handle, turned so its curve opens
#         toward the handle and spread until the handle sits down in them (lean: in / out and splay:
#         degrees outward override the turning, for hands); single = one piece the handle sits in
#         (the script finds its crotch and sizes it until the handle sits down in it)
#   rot: degrees about x, y, z applied to the raw model; select: keep only the bodies whose centre is
#   inside [x0, x1, y0, y1] of the raw model (0..1); trim: cut off the bottom fraction (stands, stems);
#   flip: mirror each piece when the automatic turn faces its curve the wrong way
#   drop_small: drop loose bits smaller than this share of the biggest; height / width: size in mm
#   (the script shrinks it if the handle would ride more than RAISE_MAX above the plain cradles)
tentacles:
  title: Octopus tentacles
  id: 751736
  file: octopus tentacle 1.stl
  author: Unicorn Dasher
  license: CC0
  mode: pair
  rot: [90, 0, 0]
  height: 48
allosaurus:
  title: Allosaurus claws
  id: 1556040
  file: allosaurus_fragilis_claw_fossil.stl
  author: cjs_3dp
  license: CC0
  mode: pair
  rot: [0, -90, 0]
  flip: true
  height: 44
  drop_small: 0.02
cyberhand:
  title: Cybernetic hand
  id: 1280802
  file: mechareka.stl
  author: Sueg
  license: CC0
  mode: pair
  lean: out
  splay: 25
  height: 50
antlers:
  title: Antlers
  id: 356636
  file: Antler_lo.stl
  author: billyd
  license: CC-BY
  mode: pair
  rot: [0, 0, 90]
  trim: 0.3
  height: 50
healinghands:
  title: Healing hands
  id: 131178
  file: Healing_Hands_Sculpture.stl
  author: The Next Layer
  license: CC-BY
  mode: pair
  select: [0.0, 1.0, 0.0, 0.45]
  rot: [0, 0, 90]
  trim: 0.07
  drop_small: 0.02
  height: 55
lobster:
