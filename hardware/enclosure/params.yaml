# Open Lounge Phone enclosure parameters (mm, degrees) - stacked "modified Trimline" form factor
# (owner decision 2026-09-27): low base slab, key deck on top, main board underneath, a raised
# hook rest (two posts) holding a G-style handset above the keypad.
#
# Base frame: x along the length, left -> right as the user faces the phone (0 = left end);
# y front (0) -> rear; z up from the table. Board frames (KiCad): x right, y DOWN from the
# board's top-left corner (top edge = rear).
#
# Everything above the SYNCED block is hand-edited design intent. The SYNCED block at the end is
# rewritten by `make sync` (sync_params.py: hardware/kicad/*/*.kicad_pcb through KiCad's pcbnew,
# falling back to hardware/layout/{boards,placement}.yaml while the .kicad_pcb is stale).

revision: r0.1

print:
  bed: [220, 220, 250]      # every printed part must fit (checked)
  clearance: 0.25           # default fit clearance per side
  wall: 2.2
  floor: 2.2
  top: 2.0
  min_wall: 2.0             # checked against every structural wall parameter
  max_overhang_deg: 45

base:                       # owner choice: A "Compact" (hardware/art/reference-base-top.png)
  length: 186.0
  depth: 94.0
  height: 33.0              # skin top over the key deck (set by the captive key stack)
  corner_r: 10.0            # plan corners
  top_chamfer: 6.0          # 45 deg top edge (prints skin-down without supports)
  bottom_chamfer: 1.5
  split_z: 14.0             # top shell / bottom tray parting line (step joint, two-tone)
  lip: {t: 1.2, h: 3.0}     # tray lip along the long walls registers the top shell
  feet: {d: 13.0, depth: 1.0, at: [[14, 12], [172, 12], [14, 82], [172, 82]]}   # 12.7 x 3.5 bumpons
  wall_mount: {enabled: true, x: [48.0, 148.0], y: 47.0, head_d: 8.5, shank_w: 4.2, slot: 8.0,
               chamber_h: 2.2, roof: 1.2}
  text: {line1: "Open Lounge Phone", size1: 6.5, line2: "r0.1  CERN-OHL-S-2.0", size2: 3.6,
         depth: 0.6, at: [93.0, 30.0]}
  logo: {enabled: true, width: 34.0, at: [93.0, 64.0], depth: 0.6}
  towers: []                # cover screws go through main-board holes (main_intent.bolts)

stack:
  main_standoff_d: 7.0
  hex_standoff: 7.0         # M2.5 F-F hex standoff between main board and deck (at the deck holes)
  under_deck_max: 4.5       # tallest main-board part allowed under the deck footprint (checked)
  rear_gap: 0.2             # USB-C / RJ9 faces to the rear wall's inner face

fasteners:                  # ONE method everywhere: M2.5 screws into brass heat-set inserts
  screw: M2.5
  clear_d: 2.8
  cbore_d: 5.6              # pan / button head (ISO 7380 / 14583)
  cbore_h: 1.9
  insert_hole_d: 3.6        # M2.5 x 4 x 3.5 OD knurled insert
  insert_depth: 5.0
  insert_len: 4.0
  boss_d: 7.0

keys:                       # MX stack (DESIGN.md s1.3, UNVERIFIED until CAD of switch + cap)
  socket_h: 1.85
  pcb_t: 1.6
  plate_top_above_pcb: 5.0
  plate_t: 1.5
  cap_top_above_plate: 14.0
  travel: 4.0
  dsa: {skirt: 18.2, top: 12.7, height: 7.6, corner_r: 1.5}
  overlap: 0.5              # skin overlaps the skirt by this much per side -> captive
  hole_clearance: 0.4       # per side, cap to skin hole within the skin thickness
  hole_r: 1.0
  printed_plate: {t: 1.5, cutout: 14.0, hole_d: 2.7}

eink:
  view: [67.5, 29.5]        # through the skin (active area 66.9 x 29.06)
  view_offset: [0.0, 0.0]   # view centre relative to panel centre (UNVERIFIED datasheet)
  view_chamfer: 1.0
  pocket_clear: 0.2
  rim_t: 1.0
  rim_h: 1.5
  panel_t: 1.0
  fpc_notch: 16.0           # rim gap on the tail side (right)

light:                      # tubes from the skin down to the plate top (stop LED bleed)
  tube_wall: 1.2
  gap_to_plate: 0.3
  status_d: 3.2
  privacy_d: 2.0
  als_d: 2.0
  bar: {length: 60.0, h: 2.4, z: 16.3, t: 1.2}   # front-edge status light line (slot + clear bar)

hook:                       # hook rest: two short drop-in metal tube posts + printed dish cradles
  finger_clearance: 34.0    # keycap tops -> handset handle underside (owner: 30-35)
  handset_y: 25.0           # handset centre line, toward the rear (base centre = 0)
  post_x_from_centre: 81.0  # tube posts; saddle inserts shift the seat to each handset's cup centres
  inserts: [pop, g1]        # printed saddle inserts, one per supported handset family
  dish: {d: 64.0, cone_deg: 20.0, rim_h: 3.0, t: 3.0}   # self-centring for any G cup 48-60 mm
  tube: {od: 12.0, wall: 1.0, socket_depth: 12.0}       # aluminium/brass tube, straight cut
  plunger: {d: 6.0, bore: 6.5, head_d: 9.0, head_h: 4.0, travel: 8.0, spring_on: 7.0, collar_d: 9.0}
  magnet: {d: 3.0, h: 1.5, br: 1.2}     # 3 x 1.5 mm N35 press-fit in the plunger tip (see ENCLOSURE.md)
  gap_on: 4.0               # magnet face above the hall package top when on-hook
  hall: {bop_max_mT: 6.8, brp_min_mT: 1.2, package_h: 1.1}   # DRV5032FA - UNVERIFIED, check datasheet
  spring: {od: 8.5, wire: 0.3, free_len: 20.0, rate_N_per_mm: 0.03}

speaker:                    # rectangular 20 x 40 mm speaker, fires up through the top grille
  size: [20.0, 40.0, 5.5]   # DESIGN.md chose 40 mm round: it does not fit beside the key deck
  centre: [18.5, 28.0]      # base x, y (front-left end region)
  wall: 2.0
  bottom_z: 15.0            # lid underside (main-board parts below must be lower)
  lid_t: 2.0
  grille_d: 1.8
  grille_pitch: 3.2
  wire_hole_d: 3.0

handset:                    # REFERENCE model (not printed): off-the-shelf USB-C retro handset,
                            # Native Union POP class (230 x 55 x 55 mm, 252 g, fixed coiled USB-C cord)
  model: pop
  length: 230.0
  cup_from_end: 27.5        # -> cup centres 175 mm apart (estimated from product photos)
  ear_d: 55.0
  mouth_d: 55.0
  cup_cyl_h: 6.0
  dome_h: 30.0
  face_bevel: 2.5
  tilt_deg: 10.0            # estimated
  handle: {w: 32.0, h: 26.0, facet: 9.0, top: 55.0, end_chamfer: 12.0}
  cable: {exit: mouth_end, d: 4.5, plug: [12.4, 6.5, 22.0]}   # USB-C overmold w x h x l (typical)
  wall: 2.0
  mass_g: 252.0

handset_alt:                # classic Western Electric G1/G3 (estimated; see ENCLOSURE.md) - the cradle
  model: g1                 # also takes it via the g1 saddle insert
  length: 216.0
  cup_from_end: 27.0        # -> 162 mm between cup centres
  ear_d: 54.0
  mouth_d: 52.0
  cup_cyl_h: 7.0
  dome_h: 30.0
  face_bevel: 2.0
  tilt_deg: 12.0
  handle: {w: 30.0, h: 24.0, facet: 6.0, top: 52.0, end_chamfer: 10.0}
  cable: {exit: mouth_end, d: 4.0, plug: [11.2, 9.0, 18.0]}
  wall: 2.0
  mass_g: 300.0

usb_c: {opening: [12.6, 7.0], centre_above_pcb: 1.63}
usb_handset: {opening: [13.0, 7.0], centre_above_pcb: 1.63, recess: [16.0, 10.0, 1.5]}
port_labels: {size: 3.2, depth: 0.5, z: 22.5, power: "5V", handset: "HANDSET"}
cord_notch: {w: 6.0, depth: 6.0}          # top-shell rear edge, above the handset port
radar: {window: [24.0, 18.0], thickness: 0.9, target_distance: 12.4, tolerance: 1.2,
        module: [22.0, 3.0, 16.0], face_ahead_of_socket: 4.0}    # LD2410C standing, UNVERIFIED
mic_port: {d: 1.6, tube_d: 4.4, gap: 0.8, capsule_h: 2.7}
pinholes: {d: 1.6, tube_d: 4.0, gap: 1.5, switch_h: 1.5}
side_buttons:               # right end face; the switches must move to the main board (see ENCLOSURE.md)
  at: [["VOL-", 20.0], ["VOL+", 28.0], ["MUTE", 37.0]]   # base y
  tab: [6.4, 5.6]
  slot: 0.7
  nub: 1.0
  tab_t: 1.2
  mute_slot: [9.0, 4.0]

main_intent:                # layout REQUIREMENTS used while the synced main board does not fit the base
  size: [180.0, 88.0]       # (base coords below; converted to board coords in ENCLOSURE.md)
  corner_r: 8.5             # board corners must clear the 7.8 mm inner wall radius
  bolts: [[8.0, 61.0], [29.0, 61.0], [157.0, 61.0], [179.0, 61.0]]   # tray -> board -> top-shell insert
  parts:                    # role: [base x, base y]; rear connectors keep their board-edge y
    usb_c: [162.0, rear]              # power in (USB-C, 5 V)
    usb_handset: [27.0, rear, usb_c]  # handset port (USB-C receptacle, USB audio host)
    hall: post                # under the right-hand post (plunger magnet)
    radar: [165.0, 24.4]
    reset: [160.0, 44.0]
    boot: [168.0, 44.0]
    mic: [158.0, 32.0]
    speaker_conn: [20.0, 55.0]
  side_buttons_x: 182.0     # VOL-/VOL+/MUTE on the main board's right edge (moved from the deck)

ref:                        # reference solids for fit checks / renders (not printed)
  usb_body: [8.94, 7.3, 3.26]

