# Self-hosted Open Lounge Phone. Copy .env.example to .env, edit it, then: docker compose up -d
# The server prints a one-time setup link on first start: docker compose logs openloungephone
services:
  openloungephone:
    build:
      context: .
      dockerfile: apps/server-selfhost/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      - openloungephone-data:/data
    # Lets the server reach LiveKit (host networking) at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # TURN relay so calls connect across NATs and mobile networks. Uses host networking because
  # TURN needs a wide UDP port range. Remove this service for LAN-only installs.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=openloungephone
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint

  # Optional media relay for rooms bigger than 4 (docker compose --profile livekit up -d). Set the
  # LIVEKIT_* variables in .env to match. Host networking for its UDP media ports.
  livekit:
    image: livekit/livekit-server:v1.9
    profiles: [livekit]
    restart: unless-stopped
    network_mode: host
    command:
      - --bind=0.0.0.0
      - --keys=${LIVEKIT_API_KEY:-openloungephone}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}

volumes:
  openloungephone-data:
