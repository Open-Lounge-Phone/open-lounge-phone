name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Protocol docs are up to date
        run: npm run docs:protocol && git diff --exit-code docs/protocol.md
      - name: Federation spec is up to date
        run: npm run docs:federation && git diff --exit-code docs/federation-spec.md
