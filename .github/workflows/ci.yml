name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Protocol docs are up to date
        run: npm run docs:protocol && git diff --exit-code docs/protocol.md
      - name: Federation spec is up to date
        run: npm run docs:federation && git diff --exit-code docs/federation-spec.md

  addon-bridge:
    name: Add-on bridge (Python unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  firmware:
    name: Firmware (ESP-IDF build)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Generated sources are up to date
        run: python3 firmware/tools/gen_board.py --check
      - name: Host unit tests (pure modules)
        run: |
          # libopus for the voice codec's tests (the phone's own comes in esp_audio_codec).
          apt-get update -qq && apt-get install -y -qq libopus-dev pkg-config >/dev/null
          make -C firmware/test/host
      - name: Release scheme (no keys or servers in source builds; official key + fw-stable in releases)
        run: python3 firmware/tools/check_release_scheme.py
      - name: Build (board, rev A)
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py size
          # The image from the defaults: rev A, no server, no update key, no update URL, no
          # wired network code linked.
          python3 tools/check_release_scheme.py --default-build build
      - name: Build (board, hw v0.2 with the wired network)
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-v02 -D SDKCONFIG=build-v02/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.v02" build
          idf.py -B build-v02 size
          # Its board id, the W5500 driver in, and still no server, update key or URL.
          python3 tools/check_release_scheme.py --board-build build-v02
      - name: Build (Wokwi simulator)
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-sim -D SDKCONFIG=build-sim/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.sim" build
      - name: Build (QEMU) and boot it
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          # The defaults (no server, updates off): it boots to "choose a server" and the packet
          # capture shows it contacts nobody.
          tools/qemu.sh build
          python3 tools/qemu_smoke.py
      - name: QEMU, hw v0.2 (its Ethernet as the cable, pulled and plugged back in)
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/qemu_cable.py
