<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Open Lounge Phone">
  <title>Open Lounge Phone</title>
  <rect width="512" height="512" rx="112" fill="#2f6f5e"/>
  <!-- handset: two cups joined by a curved grip -->
  <path d="M148 212 C 190 150, 322 150, 364 212" fill="none" stroke="#f6f4ef" stroke-width="40" stroke-linecap="round"/>
  <rect x="96" y="196" width="112" height="64" rx="32" fill="#f6f4ef"/>
  <rect x="304" y="196" width="112" height="64" rx="32" fill="#f6f4ef"/>
  <!-- keypad: the phone's two rows of six -->
  <g fill="#f2c14e">
    <rect x="96" y="300" width="44" height="44" rx="10"/>
    <rect x="150" y="300" width="44" height="44" rx="10"/>
    <rect x="204" y="300" width="44" height="44" rx="10"/>
    <rect x="258" y="300" width="44" height="44" rx="10"/>
    <rect x="312" y="300" width="44" height="44" rx="10"/>
    <rect x="366" y="300" width="50" height="44" rx="10" opacity=".7"/>
    <rect x="96" y="354" width="44" height="44" rx="10"/>
    <rect x="150" y="354" width="44" height="44" rx="10"/>
    <rect x="204" y="354" width="44" height="44" rx="10"/>
    <rect x="258" y="354" width="44" height="44" rx="10"/>
    <rect x="312" y="354" width="44" height="44" rx="10"/>
    <rect x="366" y="354" width="50" height="44" rx="10" opacity=".7"/>
  </g>
</svg>
